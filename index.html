<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storybook Language Learning App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #141414;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 900px;
      padding: 12px 20px;
      background: #1f1f1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.9rem;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: #1f1f1f;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 500px;
      background: #1a1a1a url('kitchen.jpg') center/contain no-repeat;
    }

    /* Інтерактивні точки (Hotspots) */
    .hotspot {
      position: absolute;
      border: 2px dashed rgba(255, 215, 0, 0.5);
      border-radius: 8px;
      cursor: pointer;
      background: rgba(255, 215, 0, 0.08);
      transition: all 0.3s ease;
    }

    .hotspot:hover {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.25);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
      transform: scale(1.02);
    }

    /* 6 клікабельних зон */
    #bread   { top: 68%; left: 54%; width: 14%; height: 12%; }
    #cat     { top: 62%; left: 28%; width: 10%; height: 12%; }
    #cup     { top: 65%; left: 48%; width: 6%;  height: 9%;  }
    #grinder { top: 60%; left: 78%; width: 8%;  height: 14%; }
    #oranges { top: 58%; left: 65%; width: 10%; height: 11%; }
    #kettle  { top: 48%; left: 57%; width: 8%;  height: 10%; }

    .subtitle-panel {
      background: #181818;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .subtitle-content {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2d3748;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .text-box {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #e2e8f0;
      min-height: 48px;
    }

    .controls {
      display: flex;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    .play-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .play-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <button class="nav-btn">‹ Previous Scene</button>
    <span>Page: <strong>Kitchen</strong></span>
    <button class="nav-btn">Next Scene (Beach) ›</button>
  </header>

  <div class="app-container">
    <div class="canvas-container">
      <!-- 6 предметів для натискання -->
      <div class="hotspot" id="bread" title="Click for a memory"></div>
      <div class="hotspot" id="cat" title="Click for a memory"></div>
      <div class="hotspot" id="cup" title="Click for a memory"></div>
      <div class="hotspot" id="grinder" title="Click for a memory"></div>
      <div class="hotspot" id="oranges" title="Click for a memory"></div>
      <div class="hotspot" id="kettle" title="Click for a memory"></div>
    </div>

    <div class="subtitle-panel">
      <div class="subtitle-content">
        <div class="avatar">🎙️</div>
        <div class="text-box" id="captionText">
          Click on any of the 6 items in the room to listen to a memory...
        </div>
      </div>
      <div class="controls">
        <button class="play-btn" id="replayBtn">▶ Repeat Audio</button>
      </div>
    </div>
  </div>

  <script>
    // 6 різних англомовних спогадів
    const memories = {
      bread: "I can still smell the aroma of my grandmother's fresh-baked bread on early, crisp mornings. She always said it was the warmth, not the recipe, that made it perfect.",
      cat: "The old cat used to sit on that exact wooden chair all afternoon, chasing patches of sunlight as they moved across the floor.",
      cup: "This cup of hot tea cooled down while I got lost reading an old letter from a friend I hadn't seen in years.",
      grinder: "Every Sunday morning began with the rhythmic crunching sound of this hand coffee grinder filling the house with fresh roasted scent.",
      oranges: "We bought these sweet oranges from a small street vendor near the harbor right after the rain had finally stopped.",
      kettle: "That iron kettle has a quiet whistle that always reminded me of winter evenings spent by the warm stove."
    };

    let currentText = "";
    const captionEl = document.getElementById('captionText');
    const replayBtn = document.getElementById('replayBtn');

    const synth = window.speechSynthesis;
    let selectedVoice = null;

    function setupBestVoice() {
      const voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
      selectedVoice = voices.find(v => v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Oliver')) || voices[0];
    }

    setupBestVoice();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = setupBestVoice;
    }

    function playMemory(text) {
      currentText = text;
      synth.cancel();

      captionEl.textContent = "";
      let charIndex = 0;
      const typeInterval = setInterval(() => {
        if (charIndex < text.length) {
          captionEl.textContent += text.charAt(charIndex);
          charIndex++;
        } else {
          clearInterval(typeInterval);
        }
      }, 25);

      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      utterance.rate = 1.0; 
      synth.speak(utterance);
    }

    document.querySelectorAll('.hotspot').forEach(item => {
      item.addEventListener('click', () => {
        const memoryText = memories[item.id];
        if (memoryText) playMemory(memoryText);
      });
    });

    replayBtn.addEventListener('click', () => {
      if (currentText) playMemory(currentText);
    });
  </script>
</body>
</html>
