<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storybook Language Learning App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Навігаційна шапка */
    header {
      width: 100%;
      max-width: 1000px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px 8px 0 0;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Основний контейнер для картини */
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 562px; /* Співвідношення 16:9 */
      background: #2a2a2a url('kitchen.jpg') center/cover no-repeat;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Інтерактивні точки (Hotspots) */
    .hotspot {
      position: absolute;
      border: 2px dashed rgba(255, 215, 0, 0.6);
      border-radius: 8px;
      cursor: pointer;
      background: rgba(255, 215, 0, 0.1);
      transition: all 0.3s ease;
    }

    .hotspot:hover {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.25);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
      transform: scale(1.02);
    }

    /* Позиціонування зон на карті (у відсотках) */
    #bread { top: 68%; left: 55%; width: 14%; height: 12%; }
    #cat { top: 62%; left: 28%; width: 10%; height: 12%; }
    #cup { top: 65%; left: 48%; width: 6%; height: 9%; }

    /* Панель субтитрів та плеєра */
    .subtitle-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subtitle-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #4a5568;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .text-box {
      flex: 1;
      font-size: 1.05rem;
      line-height: 1.4;
      color: #e2e8f0;
      min-height: 48px;
    }

    /* Контроли плеєра */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      font-size: 0.85rem;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .play-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    select, button.speed-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <button class="nav-btn">‹ Previous Scene</button>
    <span>Page: <strong>Kitchen</strong></span>
    <button class="nav-btn">Next Scene (Beach) ›</button>
  </header>

  <div class="canvas-container">
    <!-- Клікабельні предмети -->
    <div class="hotspot" id="bread" title="Click to hear a memory about the bread"></div>
    <div class="hotspot" id="cat" title="Click to hear a memory about the cat"></div>
    <div class="hotspot" id="cup" title="Click to hear a memory about the tea"></div>

    <!-- Панель історії / аудіо -->
    <div class="subtitle-panel">
      <div class="subtitle-content">
        <div class="avatar">🎙️</div>
        <div class="text-box" id="captionText">
          Click on any item in the kitchen to hear a story...
        </div>
      </div>
      <div class="controls">
        <div class="controls-left">
          <button class="play-btn" id="replayBtn">▶ Repeat</button>
          <span>Speed:</span>
          <button class="speed-btn" id="speedToggle">1x</button>
        </div>
        <div class="controls-right">
          <label for="voiceSelect">Voice:</label>
          <select id="voiceSelect"></select>
        </div>
      </div>
    </div>
  </div>

  <script>
    // База даних спогадів для предметів
    const memories = {
      bread: "I can still smell the aroma of my grandmother's fresh-baked bread on early, crisp mornings. She always said it was the warmth, not the recipe, that made it perfect.",
      cat: "The old cat used to sit on that exact wooden chair all afternoon, chasing patches of sunlight as they moved across the floor.",
      cup: "This cup of hot tea cooled down while I got lost reading an old letter from a friend I hadn't seen in years."
    };

    let currentSpeed = 1.0;
    let currentText = "";
    const captionEl = document.getElementById('captionText');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedBtn = document.getElementById('speedToggle');
    const replayBtn = document.getElementById('replayBtn');

    // Налаштування Web Speech API (Text-to-Speech)
    const synth = window.speechSynthesis;
    let voices = [];

    function populateVoiceList() {
      voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
      voiceSelect.innerHTML = '';
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.value = index;
        voiceSelect.appendChild(option);
      });
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // Озвучення та ефект друку
    function playMemory(text) {
      currentText = text;
      synth.cancel(); // Зупинити поточне мовлення

      // Ефект друку тексту
      captionEl.textContent = "";
      let charIndex = 0;
      const typeInterval = setInterval(() => {
        if (charIndex < text.length) {
          captionEl.textContent += text.charAt(charIndex);
          charIndex++;
        } else {
          clearInterval(typeInterval);
        }
      }, 30);

      // Синтез мовлення
      const utterance = new SpeechSynthesisUtterance(text);
      if (voices[voiceSelect.value]) {
        utterance.voice = voices[voiceSelect.value];
      }
      utterance.rate = currentSpeed;
      synth.speak(utterance);
    }

    // Обробники подій для предметів
    document.querySelectorAll('.hotspot').forEach(item => {
      item.addEventListener('click', () => {
        const memoryText = memories[item.id];
        if (memoryText) playMemory(memoryText);
      });
    });

    // Зміна швидкості
    speedBtn.addEventListener('click', () => {
      currentSpeed = currentSpeed === 1.0 ? 0.75 : 1.0;
      speedBtn.textContent = `${currentSpeed}x`;
    });

    // Повтор
    replayBtn.addEventListener('click', () => {
      if (currentText) playMemory(currentText);
    });
  </script>
</body>
</html>
