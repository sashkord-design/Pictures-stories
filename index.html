<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storybook Language Learning App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #141414;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 900px;
      padding: 12px 20px;
      background: #1f1f1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.9rem;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: #1f1f1f;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 500px;
      background: #1a1a1a url('kitchen.jpg') center/contain no-repeat;
      overflow: hidden;
    }

    /* Інтерактивні зони */
    .hotspot {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    .hotspot:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Точні координати предметів */
    #cat      { top: 62%; left: 14%; width: 18%; height: 26%; }
    #kettle   { top: 24%; left: 25%; width: 12%; height: 20%; }
    #cup      { top: 30%; left: 47%; width: 9%;  height: 16%; }
    #bread    { top: 48%; left: 62%; width: 18%; height: 18%; }
    #grinder  { top: 22%; left: 73%; width: 9%;  height: 18%; }
    #oranges  { top: 33%; left: 83%; width: 14%; height: 18%; }

    /* ==========================================
       АНІМАЦІЇ
       ========================================== */

    /* 1. Дихання кота (плавне м'яке пульсування поверх тіла кота) */
    .cat-breath-overlay {
      position: absolute;
      top: 66%;
      left: 15%;
      width: 15%;
      height: 18%;
      border-radius: 50%;
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.12);
      pointer-events: none;
      animation: catBreathe 3.2s ease-in-out infinite;
      z-index: 3;
    }

    @keyframes catBreathe {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.2; }
      50%      { transform: scale(1.05) translateY(-2px); opacity: 0.45; }
    }

    /* 2. Загальний клас для пари */
    .steam-container {
      position: absolute;
      pointer-events: none;
      z-index: 5;
    }

    /* Пара з чайника */
    .kettle-steam {
      top: 21%;
      left: 28.5%;
      width: 20px;
      height: 45px;
    }

    /* Пара з чашки */
    .cup-steam {
      top: 27%;
      left: 50.5%;
      width: 16px;
      height: 35px;
    }

    .steam-particle {
      position: absolute;
      bottom: 0;
      width: 6px;
      height: 20px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 75%);
      border-radius: 50%;
      filter: blur(2px);
      animation: riseAndFade 2.6s infinite ease-out;
      opacity: 0;
    }

    .steam-particle:nth-child(1) { left: 2px;  animation-delay: 0s; }
    .steam-particle:nth-child(2) { left: 8px;  animation-delay: 0.9s; }
    .steam-particle:nth-child(3) { left: 5px;  animation-delay: 1.7s; }

    @keyframes riseAndFade {
      0% {
        transform: translateY(0) scaleX(1);
        opacity: 0;
      }
      25% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-35px) scaleX(2.4);
        opacity: 0;
      }
    }

    /* 3. Зона вікна (щоб пташка пролітала виключно в межах скла) */
    .window-area {
      position: absolute;
      top: 0%;
      left: 70%;
      width: 30%;
      height: 45%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .bird {
      position: absolute;
      top: 35%;
      right: -25px;
      width: 16px;
      height: 10px;
      opacity: 0;
    }

    .bird-fly {
      animation: flyInWindow 4.5s linear forwards;
    }

    @keyframes flyInWindow {
      0% {
        transform: translateX(0) translateY(0) scale(0.6);
        opacity: 0;
      }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% {
        transform: translateX(-220px) translateY(-20px) scale(0.5);
        opacity: 0;
      }
    }

    .subtitle-panel {
      background: #181818;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .subtitle-content {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2d3748;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .text-box {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #e2e8f0;
      min-height: 48px;
    }

    .controls {
      display: flex;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    .play-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .play-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <button class="nav-btn">‹ Previous Scene</button>
    <span>Page: <strong>Kitchen Quest</strong></span>
    <button class="nav-btn">Next Scene (Beach) ›</button>
  </header>

  <div class="app-container">
    <div class="canvas-container">
      
      <!-- Зона вікна для пташки -->
      <div class="window-area">
        <svg class="bird" id="birdSvg" viewBox="0 0 24 16" fill="rgba(40, 50, 60, 0.75)">
          <path d="M0,6 Q6,0 12,6 Q18,0 24,6 Q16,10 12,14 Q8,10 0,6 Z"/>
        </svg>
      </div>

      <!-- Ефект дихання кота -->
      <div class="cat-breath-overlay"></div>

      <!-- Пара з чайника -->
      <div class="steam-container kettle-steam">
        <div class="steam-particle"></div>
        <div class="steam-particle"></div>
        <div class="steam-particle"></div>
      </div>

      <!-- Пара з чашки -->
      <div class="steam-container cup-steam">
        <div class="steam-particle"></div>
        <div class="steam-particle"></div>
        <div class="steam-particle"></div>
      </div>

      <!-- Hotspots -->
      <div class="hotspot" id="cat"></div>
      <div class="hotspot" id="kettle"></div>
      <div class="hotspot" id="cup"></div>
      <div class="hotspot" id="bread"></div>
      <div class="hotspot" id="grinder"></div>
      <div class="hotspot" id="oranges"></div>
    </div>

    <div class="subtitle-panel">
      <div class="subtitle-content">
        <div class="avatar">🎙️</div>
        <div class="text-box" id="captionText">
          Search the room and hover over hidden objects to uncover the story...
        </div>
      </div>
      <div class="controls">
        <button class="play-btn" id="replayBtn">▶ Repeat Audio</button>
      </div>
    </div>
  </div>

  <script>
    const memories = {
      cat: "The old cat found the warmest spot on the wooden floor right where the afternoon sun creates a golden puddle.",
      kettle: "That iron kettle has a quiet whistle that always reminded me of winter evenings spent by the warm stove.",
      cup: "A porcelain cup left half-full, holding the quiet memory of a morning that passed too quickly.",
      bread: "A crust of rustic bread resting on the table, waiting for the evening soup and shared stories.",
      grinder: "Every Sunday morning began with the rhythmic crunching sound of this hand coffee grinder filling the house with fresh roasted scent.",
      oranges: "We bought these sweet oranges from a small street vendor near the harbor right after the rain had finally stopped."
    };

    let currentText = "";
    const captionEl = document.getElementById('captionText');
    const replayBtn = document.getElementById('replayBtn');

    const synth = window.speechSynthesis;
    let selectedVoice = null;

    function setupBestVoice() {
      const voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
      selectedVoice = voices.find(v => v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Oliver')) || voices[0];
    }

    setupBestVoice();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = setupBestVoice;
    }

    function playMemory(text) {
      currentText = text;
      synth.cancel();

      captionEl.textContent = "";
      let charIndex = 0;
      const typeInterval = setInterval(() => {
        if (charIndex < text.length) {
          captionEl.textContent += text.charAt(charIndex);
          charIndex++;
        } else {
          clearInterval(typeInterval);
        }
      }, 25);

      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      utterance.rate = 1.0; 
      synth.speak(utterance);
    }

    document.querySelectorAll('.hotspot').forEach(item => {
      item.addEventListener('click', () => {
        const memoryText = memories[item.id];
        if (memoryText) playMemory(memoryText);
      });
    });

    replayBtn.addEventListener('click', () => {
      if (currentText) playMemory(currentText);
    });

    // Запуск польоту пташки суто за вікном
    const bird = document.getElementById('birdSvg');
    function triggerBirdFlight() {
      bird.classList.remove('bird-fly');
      void bird.offsetWidth; 
      bird.classList.add('bird-fly');

      const randomDelay = Math.floor(Math.random() * 6000) + 10000;
      setTimeout(triggerBirdFlight, randomDelay);
    }

    setTimeout(triggerBirdFlight, 2000);
  </script>
</body>
</html>
